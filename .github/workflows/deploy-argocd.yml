name: Deploy ArgoCD to Homelab

on:
  workflow_dispatch: # Allows manual trigger from the UI

jobs:
  deploy:
    # Use 'self-hosted' if you set up a local runner, or 'ubuntu-latest' if using a VPN tunnel
    runs-on: [self-hosted]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Create ArgoCD Namespace
      run: |
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy ArgoCD via Kustomize
      run: |
         kubectl apply -n argocd -f https://githubusercontent.com

    - name: Wait for Deployment
      run: |
          kubectl wait --namespace argocd \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/name=argocd-server \
            --timeout=300s
