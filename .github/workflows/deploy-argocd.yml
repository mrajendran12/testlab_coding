name: Install ArgoCD to Homelab

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  deploy-argocd:
    runs-on: self-hosted # Forces the job to run inside your home cluster
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
          
      - name: Create ArgoCD Namespace
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      - name: Install ArgoCD Core Components
        run: |
          kubectl apply -n argocd -f https://githubusercontent.com

      - name: Verify ArgoCD Deployment
        run: |
          kubectl rollout status deployment/argocd-server -n argocd --timeout=90s
