name: Deploy Argo CD via Homelab Runner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Authenticate Kubectl to Local Cluster
        run: |
          /host/bin/kubectl config set-cluster homelab --server=https://cluster.local --insecure-skip-tls-verify=true
          /host/bin/kubectl config set-credentials runner --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          /host/bin/kubectl config set-context homelab --cluster=homelab --user=runner
          /host/bin/kubectl config use-context homelab

      - name: Create Argo CD Namespace
        run: |
          /host/bin/kubectl create namespace argocd --dry-run=client -o yaml | /host/bin/kubectl apply -f -

      - name: Install Argo CD Manifests
        run: |
          /host/bin/kubectl apply -n argocd -f https://githubusercontent.com
