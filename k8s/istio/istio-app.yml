apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://googleapis.com'
    chart: base
    targetRevision: 1.24.0 # Replace with your preferred stable Istio version
  destination:
    server: 'https://default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://googleapis.com'
    chart: istiod
    targetRevision: 1.24.0 # Must match the base version above
  destination:
    server: 'https://default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
